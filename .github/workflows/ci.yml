name: Public site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test-links-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm run build
      - run: npm run check
      - name: Generated files match reviewed sources
        run: git diff --exit-code -- public assets.mjs source/template.html
