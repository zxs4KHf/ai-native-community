{
  "name": "功能建议",
  "description": "说明你想完成的事和期望的功能。",
  "title": "[功能] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "反馈会公开显示在本仓库 Issues。请先[搜索已有反馈](https://github.com/zxs4KHf/ai-native-community/issues?q=is%3Aissue)，不要提交个人信息、账号、密钥、未脱敏日志或截图。安全漏洞请勿公开发 Issue，参见[私密报告说明](https://github.com/zxs4KHf/ai-native-community/security/policy)。登录 GitHub 后，检查内容并自行点击提交。"
      }
    },
    {
      "type": "textarea",
      "id": "goal",
      "attributes": {
        "label": "你想解决什么事？",
        "placeholder": "我想……，现在需要……"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "suggestion",
      "attributes": {
        "label": "你的功能建议"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "page",
      "attributes": {
        "label": "所在页面（可选）",
        "description": "仅保留本站页面路径；请勿粘贴带密钥或私人参数的链接。"
      },
      "validations": {
        "required": false
      }
    }
  ]
}
