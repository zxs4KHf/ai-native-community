<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">AI native 社区 · 奥特大出生</title>
  <desc id="desc">连接工具、方法与共同实践。先发现入口，再完成小事，留下可复用的经验。</desc>
  <rect width="1280" height="400" rx="16" fill="#f7f5ef"/>
  <rect x="1" y="1" width="1278" height="398" rx="15" fill="none" stroke="#dedacf"/>
  <g stroke="#b36243" stroke-width="3" stroke-linecap="round" transform="translate(65 67)">
    <path d="M0-17V17M-17 0H17M-12-12L12 12M-12 12L12-12"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
    <text x="100" y="73" font-size="15" letter-spacing="2" fill="#8e442d">奥特大出生 · AN AI NATIVE COMMUNITY</text>
    <text x="48" y="169" font-family="Georgia,'Noto Serif SC','Songti SC',serif" font-size="62" fill="#292823">AI native 社区</text>
    <text x="51" y="229" font-size="23" fill="#747469">把工具、方法与人连接起来。</text>
    <text x="51" y="269" font-size="23" fill="#747469">让想法有地方开始，让实践有迹可循。</text>
    <path d="M51 311H615" stroke="#dedacf"/>
    <text x="51" y="350" font-size="16" fill="#8e442d">工具导航</text>
    <text x="172" y="350" font-size="16" fill="#8e442d">实践资料</text>
    <text x="293" y="350" font-size="16" fill="#8e442d">效率工具</text>
    <text x="414" y="350" font-size="16" fill="#8e442d">一起共建</text>
    <path d="M713 49V351" stroke="#dedacf"/>
    <g fill="#fcfbf7" stroke="#dedacf">
      <rect x="774" y="49" width="443" height="78" rx="7"/>
      <rect x="774" y="161" width="443" height="78" rx="7"/>
      <rect x="774" y="273" width="443" height="78" rx="7"/>
    </g>
    <g font-size="13" fill="#b36243"><text x="797" y="80">01 / FIND</text><text x="797" y="192">02 / TRY</text><text x="797" y="304">03 / SHARE</text></g>
    <g font-size="24" fill="#292823"><text x="934" y="97">发现一个入口</text><text x="934" y="209">完成一件小事</text><text x="934" y="321">留下可用经验</text></g>
    <path d="M995 135V151M990 146L995 151L1000 146M995 247V263M990 258L995 263L1000 258" stroke="#b36243" fill="none" stroke-width="1.5"/>
